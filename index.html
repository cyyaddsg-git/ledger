<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#0F1712">
<title>Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:#0F1712;
  --surface:#16211B;
  --surface-2:#1D2A22;
  --border:#263429;
  --gold:#E8B84B;
  --gold-dim:rgba(232,184,75,0.14);
  --expense:#FF6B6B;
  --income:#4ADE80;
  --text:#F2F0E9;
  --text-dim:#8FA396;
  --text-faint:#5B6A60;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overscroll-behavior:none;}
button,input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;}
button{background:none;border:none;cursor:pointer;-webkit-user-select:none;user-select:none;}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

#root{min-height:100dvh;display:flex;flex-direction:column;}
.screen-container{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.add-screen{display:flex;flex-direction:column;flex:1;min-height:100%;}
.history-screen{display:flex;flex-direction:column;}
.market-screen{display:flex;flex-direction:column;flex:1;min-height:100%;}
.market-frame{flex:1 1 auto;width:100%;border:0;background:#080d0a;min-height:60vh;}
.market-note{color:var(--text-faint);font-size:11px;padding:8px 20px calc(env(safe-area-inset-bottom) + 4px);line-height:1.5;}

.app-header{padding:calc(env(safe-area-inset-top) + 16px) 20px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-0.02em;}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
.currency-pill{background:var(--surface-2);border:1px solid var(--border);font-family:'JetBrains Mono';font-size:13px;padding:7px 12px;border-radius:20px;}
.export-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--gold);font-weight:600;font-size:13px;padding:7px 14px;border-radius:20px;white-space:nowrap;}
.export-btn:active{background:var(--gold-dim);}
.export-btn.import-btn{color:var(--text-dim);}
.info-btn{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font-size:15px;display:flex;align-items:center;justify-content:center;}
.info-btn:active{background:var(--gold-dim);color:var(--gold);}
.tx-pm{font-size:12px;}

.date-row{padding:0 20px 12px;}
.date-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500;color:var(--text);font-family:'Inter',sans-serif;-webkit-appearance:auto;}
.date-input::-webkit-date-and-time-value{text-align:left;}

.segmented{display:flex;margin:6px 20px 0;background:var(--surface);border-radius:14px;padding:4px;}
.segmented button{flex:1;font-family:'Inter';font-weight:600;font-size:14px;padding:9px 0;border-radius:10px;color:var(--text-dim);transition:background .15s,color .15s;}
.segmented button.active.expense{background:rgba(255,107,107,0.14);color:var(--expense);}
.segmented button.active.income{background:rgba(74,222,128,0.14);color:var(--income);}

.amount-wrap{text-align:center;padding:26px 20px 16px;}
.amount-row{display:flex;align-items:baseline;justify-content:center;gap:8px;}
.amount-symbol{font-family:'JetBrains Mono';font-size:18px;color:var(--text-faint);}
.amount{font-family:'Space Grotesk';font-weight:700;font-size:52px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}

.cat-row{display:flex;gap:10px;overflow-x:auto;padding:4px 20px 16px;scrollbar-width:none;}
.cat-row::-webkit-scrollbar{display:none;}
.cat-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px;}
.cat-bubble{width:52px;height:52px;border-radius:16px;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .15s,background .15s,border-color .15s;}
.cat-chip.selected .cat-bubble{background:var(--gold-dim);border-color:var(--gold);transform:scale(1.06);}
.cat-label{font-size:11px;color:var(--text-dim);font-weight:500;}
/* the TA category this button becomes -- shown only when it differs from the label */
.cat-ta{font-size:9px;color:var(--text-dim);opacity:.6;font-weight:400;line-height:1.1;max-width:64px;text-align:center;}
.cat-chip.selected .cat-ta{color:var(--gold);opacity:.85;}
.cat-chip.selected .cat-label{color:var(--gold);}

.pm-row{display:flex;gap:8px;overflow-x:auto;padding:0 20px 14px;scrollbar-width:none;}
.pm-row::-webkit-scrollbar{display:none;}
.pm-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:var(--surface);border:1.5px solid var(--border);font-size:13px;font-weight:500;color:var(--text-dim);transition:background .15s,border-color .15s,color .15s;}
.pm-chip.selected{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
.pm-chip.more{border-style:dashed;}
.pm-label{font-size:13px;}

/* pay-method bottom sheet: grouped 3-column grid, mirrors the currency sheet */
.pm-group-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin:16px 0 8px;}
.pm-group-label:first-of-type{margin-top:2px;}
.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pm-item{background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px;justify-content:center;}
.pm-item.selected{border-color:var(--gold);background:var(--gold-dim);}
.pm-item.selected .pm-label{color:var(--gold);}
.pm-item.placeholder{opacity:.55;}
.pm-icon{font-size:16px;}
.pm-item .pm-label{font-size:10.5px;color:var(--text-dim);text-align:center;line-height:1.25;}

.info-row{padding:11px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.info-row .k{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.info-row .v{font-size:13px;color:var(--text-dim);line-height:1.55;}
.info-row .v b{color:var(--gold);font-weight:600;}

.note-wrap{padding:0 20px 10px;}
.note-input{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--border);padding:9px 2px;outline:none;font-size:15px;}
.note-input:focus{border-color:var(--gold);}
.note-input::placeholder{color:var(--text-faint);}

.spacer{flex:1;}

.keypad{padding:6px 16px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.key{background:var(--surface);border-radius:14px;height:54px;font-family:'Space Grotesk';font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:background .1s,transform .1s;}
.key:active{background:var(--surface-2);transform:scale(0.95);}
.key svg{width:20px;height:20px;stroke:var(--text-dim);}

.save-btn{margin:6px 20px 18px;background:var(--gold);color:#14200F;border-radius:16px;height:52px;font-family:'Space Grotesk';font-weight:700;font-size:16px;transition:transform .1s;}
.save-btn:disabled{background:var(--surface-2);color:var(--text-faint);}
.save-btn:active:not(:disabled){transform:scale(0.98);}

.tabbar{flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:11px;font-weight:600;}
.tabbar button.active{color:var(--gold);}
.tabbar svg{width:22px;height:22px;stroke:currentColor;}

.balance-row{display:flex;gap:10px;padding:6px 20px 18px;overflow-x:auto;scrollbar-width:none;}
.balance-row::-webkit-scrollbar{display:none;}
.balance-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 18px;min-width:150px;flex:0 0 auto;}
.balance-currency{font-family:'JetBrains Mono';font-size:11px;color:var(--text-faint);letter-spacing:.08em;margin-bottom:4px;}
.balance-amount{font-family:'Space Grotesk';font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;}
.balance-amount.pos{color:var(--income);}
.balance-amount.neg{color:var(--expense);}
.balance-sub{display:flex;gap:10px;margin-top:6px;font-family:'JetBrains Mono';font-size:11px;}
.balance-sub .pos{color:var(--income);}
.balance-sub .neg{color:var(--expense);}

.tx-list{padding:4px 20px 24px;}
.date-label{font-weight:600;font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;}
.tx-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.tx-bubble{width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-cat{font-weight:600;font-size:14px;}
.tx-note{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.tx-right{text-align:right;}
.tx-amount{font-family:'JetBrains Mono';font-weight:600;font-size:14px;}
.tx-amount.expense{color:var(--expense);}
.tx-amount.income{color:var(--income);}
.tx-time{font-size:10px;color:var(--text-faint);margin-top:2px;}
.tx-del{color:var(--text-faint);padding:4px;margin-left:2px;}
.tx-del svg{width:16px;height:16px;stroke:currentColor;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 30px;text-align:center;gap:4px;flex:1;}
.empty-emoji{font-size:40px;margin-bottom:8px;}
.empty-title{font-family:'Space Grotesk';font-weight:700;font-size:18px;}
.empty-sub{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
.empty-cta{background:var(--gold);color:#14200F;border-radius:12px;padding:11px 20px;font-family:'Space Grotesk';font-weight:700;font-size:14px;}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;display:flex;align-items:center;gap:10px;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.undo-btn{color:var(--gold);font-weight:700;font-size:13px;}

.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;z-index:60;}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:4px auto 14px;}
.sheet-title{font-family:'Space Grotesk';font-weight:700;font-size:16px;margin-bottom:10px;}
.sheet-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sheet-item{background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.sheet-item.selected{border-color:var(--gold);background:var(--gold-dim);}
.sheet-sym{font-family:'JetBrains Mono';font-weight:600;font-size:15px;}
.sheet-code{font-size:10px;color:var(--text-dim);}

.cat-head{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 4px;}
.cat-head-l{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.ta-row{display:flex;align-items:baseline;gap:8px;padding:6px 2px;border-bottom:1px solid var(--border);font-size:13px;}
.ta-from{flex:0 0 46%;}
.ta-arrow{color:var(--text-dim);opacity:.5;}
.ta-to{color:var(--gold);font-weight:600;}
.ta-to.open{color:var(--text-dim);font-weight:400;font-style:italic;}
.ta-note{font-size:11px;color:var(--text-dim);line-height:1.5;margin:8px 2px 12px;}
.ta-btn{background:none;border:1px solid var(--border);border-radius:999px;color:var(--text-dim);font-size:11px;padding:3px 11px;font-family:inherit;}
.tx-row.pending{opacity:.9;}
.tx-amount.unknown{color:var(--text-faint);font-style:italic;}
.tx-edit{flex:0 0 auto;color:var(--text-faint);padding:4px;}
.tx-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;}
.editing-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
 margin:0 20px 6px;padding:7px 14px;border-radius:12px;background:var(--gold-dim);
 border:1px solid rgba(232,184,75,.45);color:var(--gold);font-size:12px;font-weight:600;}
.editing-bar button{color:var(--gold);text-decoration:underline;font-size:12px;font-family:inherit;}
.balance-sub .pend{color:var(--gold);}
.bills-screen{display:flex;flex-direction:column;flex:1;min-height:100%;}
.bm-nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 20px 10px;}
.bm-nav button{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;
 width:34px;height:34px;color:var(--text);font-size:17px;line-height:1;}
.bm-mlabel{font-family:'Space Grotesk';font-weight:700;font-size:16px;min-width:150px;text-align:center;}
.bm-chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px 12px;}
.bm-chip{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;
 background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
.bm-chip.over{background:rgba(255,107,107,.14);color:var(--expense);border-color:rgba(255,107,107,.4);}
.bm-chip.due{background:var(--gold-dim);color:var(--gold);border-color:rgba(232,184,75,.4);}
.bm-chip.paid{background:rgba(74,222,128,.12);color:var(--income);border-color:rgba(74,222,128,.35);}
.bm-list{padding:0 20px 20px;}
.bm-today{display:flex;align-items:center;gap:10px;margin:12px 0 6px;}
.bm-today span{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold);
 background:var(--gold-dim);border-radius:999px;padding:3px 11px;}
.bm-day{display:flex;gap:12px;margin-bottom:10px;}
.bm-daynum{flex:0 0 30px;height:30px;border-radius:10px;background:var(--surface-2);
 border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
 font-size:12px;font-weight:700;color:var(--text-dim);margin-top:4px;}
.bm-items{flex:1;display:flex;flex-direction:column;gap:6px;}
.bm-item{display:flex;align-items:center;gap:10px;background:var(--surface);
 border:1.5px solid var(--border);border-radius:14px;padding:9px 12px;}
.bm-item.over{border-color:rgba(255,107,107,.55);}
.bm-item.due{border-color:rgba(232,184,75,.5);}
.bm-item.paid{opacity:.62;}
.bm-item.auto,.bm-item.tenant{opacity:.55;}
.bm-tick{flex:0 0 28px;height:28px;border-radius:9px;border:1.5px solid var(--border);
 background:var(--surface-2);color:var(--text-dim);font-size:13px;font-weight:700;}
.bm-tick.paid{background:rgba(74,222,128,.16);border-color:var(--income);color:var(--income);}
.bm-tick.over{border-color:var(--expense);}
.bm-tick:disabled{opacity:.5;}
.bm-body{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;}
.bm-nm{font-size:14px;font-weight:600;color:var(--text);}
.bm-sub{font-size:10.5px;color:var(--text-faint);}
.bm-note{font-size:10.5px;color:var(--gold);opacity:.85;margin-top:2px;}
.bm-tag{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.bm-tag.over{background:rgba(255,107,107,.16);color:var(--expense);}
.bm-tag.due{background:var(--gold-dim);color:var(--gold);}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);}
</style>
</head>

// --- Import: restore from a previously-exported ledger_YYYY-MM.md (or a
// raw .json with the same {transactions:[...]} shape). This is the recovery
// half of Export — the only real defense against a wiped/reinstalled icon.

function extractTransactionsFromText(text){
  var m = text.match(/```json\s*([\s\S]*?)```/);
  var raw = m ? m[1] : text;
  var data = JSON.parse(raw);
  var list = Array.isArray(data) ? data : data.transactions;
  if(!Array.isArray(list)) throw new Error('no transactions[] found');
  return list;
}

function mergeTransactions(list){
  var seen = {};
  state.transactions.forEach(function(t){ if(t.id) seen[t.id] = true; });
  var added = 0, skipped = 0;
  list.forEach(function(t){
    if(!t || !t.id || seen[t.id]){ skipped++; return; }
    seen[t.id] = true;
    state.transactions.push(t);
    added++;
  });
  sortTransactions();
  return {added: added, skipped: skipped};
}


// Restore bill ticks and notes from an export. MERGES: an existing tick or note is
// never overwritten, only missing ones are filled, so re-importing the same file twice
// changes nothing. Accepts this app's export and the standalone Bill Manager's.
function mergeBills(text){
  var added = {ticks:0, notes:0};
  var m = text.match(/```json\s*([\s\S]*?)```/);
  if(!m) return added;
  var data;
  try{ data = JSON.parse(m[1]); }catch(e){ return added; }
  var months = data.bills || (data.months && !data.transactions ? data.months : null);
  if(!months) return added;
  Object.keys(months).forEach(function(ym){
    if(!/^\d{4}-\d{2}$/.test(ym)) return;
    var inc = months[ym] || {};
    var p = bmLoad('bm_paid_'+ym), n = bmLoad('bm_note_'+ym);
    Object.keys(inc.paid||{}).forEach(function(id){
      if(p[id]===undefined){ p[id]=inc.paid[id]; added.ticks++; }
    });
    Object.keys(inc.note||{}).forEach(function(id){
      if(!n[id]){ n[id]=inc.note[id]; added.notes++; }
    });
    bmSave('bm_paid_'+ym,p); bmSave('bm_note_'+ym,n);
  });
  return added;
}

function triggerImport(){

function handleImportFile(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = ''; // reset so re-picking the same file later still fires onchange
  if(!file) return;
  var reader = new FileReader();
  reader.onload = async function(){
    try{
      var text = String(reader.result);
      var res = {added:0, skipped:0};
      try{ res = mergeTransactions(extractTransactionsFromText(text)); }
      catch(e){ /* a bills-only export has no transactions[] -- that is fine */ }
      var bres = mergeBills(text);
      var accts = 0;
      try{
        var j = JSON.parse(text);
        if(j && j.accounts && typeof j.accounts === 'object'){
          var cur = {}; try{ cur = JSON.parse(localStorage.getItem('bm_accts_v1')||'{}'); }catch(e){}
          Object.keys(j.accounts).forEach(function(k){ cur[k] = j.accounts[k]; accts++; });
          localStorage.setItem('bm_accts_v1', JSON.stringify(cur));
          loadAccts();
        }
      }catch(e){ /* not JSON, or no accounts block -- normal for a .md export */ }
      await persist();
      render();
      var bits = [];
      if(res.added || !bres.ticks && !bres.notes) bits.push(res.added + ' txn');
      if(bres.ticks) bits.push(bres.ticks + ' tick');
      if(bres.notes) bits.push(bres.notes + ' note');
      if(accts) bits = [accts + (accts===1 ? ' account' : ' accounts')];
      showToast(bits.join(' &middot; ') + ' imported' +
                (res.skipped ? ' &middot; ' + res.skipped + ' already had' : ''));
    }catch(e){
      showToast('Import failed — not a Ledger export file');
    }
  };
  reader.onerror = function(){ showToast('Import failed — could not read that file'); };
  reader.readAsText(file);
}

// Most-recently-used distinct pay methods, newest first (transactions are
// stored newest-first already). Caps at 3 so the inline row stays compact;
// anything else is one tap away via the "More" chip / full sheet.
function mruPayMethods(){
  var seen = {}, out = [];
  for(var i=0;i<state.transactions.length && out.length<3;i++){
    var pm = state.transactions[i].payMethod;
    if(pm && !seen[pm.id]){ seen[pm.id]=true; out.push(pm); }
  }
  return out;
}

// Selected calendar date (state.date, for backdating) + the real current
// time-of-day, as a local Date -> ISO string. Keeps history sorting sane —
// backdated entries land on the right day, not "just now" at the top.
function combinedDateISO(){
  var now = new Date();
  var parts = state.date.split('-').map(Number);
  var d = new Date(parts[0], parts[1]-1, parts[2], now.getHours(), now.getMinutes(), now.getSeconds());
  return d.toISOString();
}

// Transactions must stay sorted newest-first: mruPayMethods() and the
// History grouping both assume it, and backdating breaks plain unshift/push
// ordering.
function sortTransactions(){
  state.transactions.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
}

async function saveTransaction(){
  var amt = parseFloat(state.amount);
  // An amount of 0 is saved as UNKNOWN, not as zero. They are different facts: "this
  // happened but I do not know the figure yet" vs "this cost nothing". Storing 0 for
  // both would put a fake zero into TA's totals and there would be no way to find the
  // rows still waiting for a number. amount stays null and amountUnknown flags it.
  var unknown = !(amt > 0);
  if(!state.category) return;
  if(unknown && !state.payMethod) return;   // a jot is only useful with a pay channel
  var catList = state.type === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  var cat = catList.find(function(c){ return c.id === state.category; });

  if(state.editing){
    var ex = state.transactions.filter(function(t){ return t.id === state.editing; })[0];
    if(ex){
      ex.type = state.type;
      ex.amount = unknown ? null : amt;
      ex.amountUnknown = unknown;
      ex.currency = state.currency;
      ex.category = cat;
      ex.payMethod = state.payMethod;
      ex.note = state.note.trim();
      ex.date = combinedDateISO();
      ex.editedAt = new Date().toISOString();
    }
    sortTransactions();
    await persist();
    clearEntry();
    state.tab = 'history';
    render();
    showToast(unknown ? 'Updated — amount still unknown' : 'Updated');
    return;
  }

  var tx = {
    id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    type: state.type, amount: unknown ? null : amt, amountUnknown: unknown,
    currency: state.currency,
    category: cat, payMethod: state.payMethod, note: state.note.trim(), date: combinedDateISO()
  };
  state.transactions.push(tx);
  sortTransactions();
  await persist();
  clearEntry();
  render();
  showToast(unknown ? 'Jotted — add the amount later' : 'Saved');
}

function clearEntry(){
  state.amount = '0'; state.note = ''; state.category = null;
  state.payMethod = null; state.date = todayStr(); state.editing = null;
}

// Load an existing row back into the Add screen. This is how an unknown amount gets
// filled in once the statement arrives -- jot it now, complete it later.
function editTx(id){
  var t = state.transactions.filter(function(x){ return x.id === id; })[0];
  if(!t) return;
  state.editing = id;
  state.tab = 'add';
  state.type = t.type;
  state.amount = (t.amountUnknown || t.amount == null) ? '0' : String(t.amount);
  state.currency = t.currency;
  state.category = t.category ? t.category.id : null;

function deleteTx(id){
  var idx = state.transactions.findIndex(function(t){ return t.id === id; });
  if(idx === -1) return;
  pendingDelete = {tx: state.transactions[idx], idx: idx};
  state.transactions.splice(idx,1);
  persist();
  render();
  showToast('Deleted <button class="undo-btn" onclick="undoDelete()">Undo</button>');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(function(){ pendingDelete = null; }, 4000);
}
function undoDelete(){
  if(!pendingDelete) return;
  state.transactions.splice(pendingDelete.idx, 0, pendingDelete.tx);
  pendingDelete = null;
  clearTimeout(undoTimer);
  document.getElementById('toast').classList.remove('show');
  persist();
  render();
}

function dateLabel(iso){
  var d = new Date(iso);
  var now = new Date();
  var startOfDay = function(x){ return new Date(x.getFullYear(), x.getMonth(), x.getDate()); };
  var diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if(diffDays === 0) return 'Today';
  if(diffDays === 1) return 'Yesterday';
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined});
}
function groupByDate(list){
  var map = new Map();
  for(var i=0;i<list.length;i++){
    var t = list[i];
    var label = dateLabel(t.date);
    if(!map.has(label)) map.set(label, []);
    map.get(label).push(t);
  }
  return Array.from(map.entries()).map(function(e){ return {label: e[0], items: e[1]}; });
}
function currencyTotals(){
  var totals = {};
  for(var i=0;i<state.transactions.length;i++){
    var t = state.transactions[i];
    if(!totals[t.currency]) totals[t.currency] = {income:0, expense:0, pending:0};
    if(t.amountUnknown || t.amount == null){ totals[t.currency].pending++; continue; }
    totals[t.currency][t.type] += t.amount;
  }
  return totals;
}

function monthKey(iso){
  var d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

async function exportMonth(){
  var now = new Date();
  var defaultYm = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var ym = window.prompt('Export which month? (YYYY-MM)', defaultYm);
  if(!ym) return;
  var list = state.transactions.filter(function(t){ return monthKey(t.date) === ym; });
  if(list.length === 0){ showToast('No entries for ' + ym); return; }
  list = list.slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });

  var totals = {};
  list.forEach(function(t){
    if(!totals[t.currency]) totals[t.currency] = {income:0, expense:0, pending:0};
    // forEach callback -- `return` skips this entry, `continue` would be illegal here.
    if(t.amountUnknown || t.amount == null){ totals[t.currency].pending++; return; }
    totals[t.currency][t.type] += t.amount;
  });

  var rows = list.map(function(t){
    var d = new Date(t.date);
    var dateStr = d.toISOString().slice(0,10);
    var timeStr = d.toTimeString().slice(0,5);
    var sym = CURRENCIES[t.currency] || t.currency;
    var amt = (t.amountUnknown || t.amount == null)
      ? sym + ' ? (amount not known — jotted for TA to match)'
      : (t.type==='expense'?'-':'+') + sym + t.amount.toFixed(2);
    return '| ' + dateStr + ' | ' + timeStr + ' | ' + (t.type==='expense'?'Expense':'Income') + ' | ' +
      t.category.label + ' | ' + (t.payMethod ? t.payMethod.label : '') + ' | ' + amt + ' | ' +
      (t.note ? t.note.replace(/\|/g,'/') : '') + ' |';
  }).join('\n');

  var totalsLines = Object.keys(totals).map(function(c){
    var t = totals[c]; var net = t.income - t.expense;
    return '- **' + c + '**: income +' + t.income.toFixed(2) + ', expense -' + t.expense.toFixed(2) +
      ', net ' + (net>=0?'+':'') + net.toFixed(2);
  }).join('\n');

  var generated = new Date().toISOString();
  // Each entry carries the TA category it maps to, so TA never has to translate this
  // app's button names. null = TA will surface it as Unidentified for YY.
  var listForExport = list.map(function(t){
    var o = {}; for(var k in t) o[k] = t[k];
    // t.category is the stored category OBJECT {id,emoji,label}, not an id string --
    // passing the object gave every exported row ta_category:null from P6 until
    // 2026-08-25. Caught only by exporting a row saved through the real save path.
    o.ta_category = taCategory(t.category && t.category.id ? t.category.id : t.category);
    return o;
  });
  // Bills travel in the SAME file as the transactions -- one export is the whole
  // backup, so there is never a half-restored device. Keys are unchanged
  // (bm_paid_<YYYY-MM> / bm_note_<YYYY-MM>), so an export from the standalone Bill
  // Manager still imports here and vice versa.
  var billsOut = {};
  try{
    for(var bi=0; bi<localStorage.length; bi++){
      var lk = localStorage.key(bi);
      var bmm = /^bm_(paid|note)_(\d{4}-\d{2})$/.exec(lk);
      if(!bmm) continue;
      billsOut[bmm[2]] = billsOut[bmm[2]] || {paid:{}, note:{}};
      billsOut[bmm[2]][bmm[1]] = JSON.parse(localStorage.getItem(lk)||'{}');
    }
  }catch(e){}
  var nTick = 0, nNote = 0;
  Object.keys(billsOut).forEach(function(k){
    nTick += Object.keys(billsOut[k].paid||{}).filter(function(i){return billsOut[k].paid[i];}).length;
    nNote += Object.keys(billsOut[k].note||{}).filter(function(i){return billsOut[k].note[i];}).length;
  });
  var jsonBlock = JSON.stringify({month: ym, generated: generated, schema: 'ledger-app/3',
    taxonomy: 'i001 taxonomy.json 2026-08-22', transactions: listForExport, totals: totals,
    bills: billsOut, bill_register: BILLS.length}, null, 2);

  var md = '# Ledger — ' + ym + '\n\n' +
    'Generated ' + generated + ' from the Ledger phone app. ' + list.length + ' entries.\n\n' +
    '| Date | Time | Type | Category | Pay method | Amount | Note |\n' +
    '|---|---|---|---|---|---|---|\n' +
    rows + '\n\n' +
    '**Totals**\n\n' + totalsLines + '\n\n' +
    (Object.keys(billsOut).length
      ? '## Bills — payment record\n\n' + nTick + ' paid tick(s), ' + nNote +
        ' note(s), against a ' + BILLS.length + '-bill register.\n\n' +
        '| Month | Bill | Paid | Note |\n|---|---|---|---|\n' +
        Object.keys(billsOut).sort().map(function(k){
          var d=billsOut[k], seen={}, out=[];
          Object.keys(d.paid||{}).forEach(function(i){seen[i]=1;});
          Object.keys(d.note||{}).forEach(function(i){seen[i]=1;});
          Object.keys(seen).sort().forEach(function(id){
            var b=null; for(var q=0;q<BILLS.length;q++) if(BILLS[q].id===id) b=BILLS[q];
            out.push('| '+k+' | '+(b?b.nm:id)+' | '+((d.paid||{})[id]?'PAID':'')+' | '+
                     String((d.note||{})[id]||'').replace(/\|/g,'/')+' |');
          });
          return out.join('\n');
        }).join('\n') + '\n\n'
      : '') +
    '<details><summary>Raw data (for machine parsing — reconcile against the totals above)</summary>\n\n' +
    '```json\n' + jsonBlock + '\n```\n\n</details>\n';

  var filename = 'ledger_' + ym + '.md';
  var blob = new Blob([md], {type:'text/markdown'});

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([blob], filename, {type:'text/markdown'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: filename});
        showToast('Exported');
        return;
      }
    }catch(e){ /* user cancelled share, or unsupported — fall through to direct download */ }
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast('Saved to Downloads');
}

      var note=notes[b.id]||'';
      listHTML+='<div class="bm-item '+st+'">'
        + '<button class="bm-tick '+st+'" '+(manual?'onclick="toggleBill(\''+b.id+'\')"':'disabled')+'>'+mark+'</button>'
        + '<button class="bm-body" onclick="openBill(\''+b.id+'\')">'
        +   '<span class="bm-nm">'+escapeHtml(b.nm)+'</span>'
        +   '<span class="bm-sub">'+escapeHtml(b.grp)+' &middot; '+escapeHtml(b.chan)+'</span>'
        +   (note?'<span class="bm-note">'+escapeHtml(note)+'</span>':'')
        + '</button>'
        + (st==='over'||st==='due' ? '<span class="bm-tag '+st+'">'+ST_LABEL[st]+'</span>' : '')
        + '</div>';
    });
    listHTML+='</div></div>';
  });

  return '<div class="bills-screen">'
    + importInputHTML()
    + '<div class="app-header"><div class="brand">Bills</div>'
    +   '<div class="header-actions">'+infoButtonHTML()
    +   '<button class="export-btn import-btn" onclick="triggerImport()">Import</button>'
    +   '<button class="export-btn" onclick="exportMonth()">Export</button></div></div>'
    + '<div class="bm-nav"><button onclick="shiftBillMonth(-1)">&lsaquo;</button>'
    +   '<div class="bm-mlabel">'+BILL_MONTHS[billMonth.getMonth()]+' '+billMonth.getFullYear()+'</div>'
    +   '<button onclick="shiftBillMonth(1)">&rsaquo;</button></div>'
    + '<div class="bm-chips">'
    +   (n.over?'<span class="bm-chip over">'+n.over+' overdue</span>':'')
    +   (n.due?'<span class="bm-chip due">'+n.due+' due soon</span>':'')
    +   '<span class="bm-chip up">'+n.up+' to pay</span>'
    +   '<span class="bm-chip paid">'+n.paid+' paid</span>'
    +   '<span class="bm-chip auto">'+n.auto+' auto</span>'
    +   (n.tenant?'<span class="bm-chip tenant">'+n.tenant+' tenant</span>':'')
    + '</div>'
    + '<div class="bm-list">'+listHTML+'</div>'
    + '</div>';
}

function billSheetHTML(){
  var b=null, i;
  for(i=0;i<BILLS.length;i++) if(BILLS[i].id===state.billOpen) b=BILLS[i];
  if(!b) return '';
  var key=bmKey(billMonth);
  var notes=bmLoad('bm_note_'+key), paid=bmLoad('bm_paid_'+key);
  var ta=taForBill(b);
  function row(k,v){
    return v ? '<div class="ta-row"><span class="ta-from">'+escapeHtml(k)+
               '</span><span class="ta-to">'+escapeHtml(String(v))+'</span></div>' : '';
  }
  return '<div class="sheet-backdrop" onclick="closeBill()">'
    + '<div class="sheet" onclick="event.stopPropagation()">'
    +   '<div class="sheet-handle"></div>'
    +   '<div class="sheet-title">'+escapeHtml(b.nm)+'</div>'
    +   row('Category', b.grp)
    +   (acctFor(b.id) ? row('Account', acctFor(b.id))
         : '<div class="ta-row"><span class="ta-from">Account</span><span class="ta-to" style="color:var(--text-faint)">not on this phone &mdash; Import ledger_accounts.json</span></div>')
    +   row('Due', 'day '+b.due+' of the month')
    +   row('Statement issued', b.stmt==='Np' ? 'previous month' : (b.stmt||''))
    +   row('Pay channel', b.chan)
    +   row('Frequency', b.freq)
    +   row('Books to (TA)', ta || 'not mapped')
    +   (b.info?'<div class="ta-note">'+escapeHtml(b.info)+'</div>':'')
    +   '<div class="note-wrap" style="padding:10px 0 4px"><input class="note-input" '
    +     'placeholder="Note — how you paid it" value="'+escapeHtml(notes[b.id]||'')+'" '
    +     'oninput="setBillNote(\''+b.id+'\', this.value)"></div>'
    +   (b.mode==='manual'
        ? '<button class="save-btn" style="margin-top:10px" onclick="toggleBill(\''+b.id+'\');closeBill();">'
          + (paid[b.id]?'Mark unpaid':'Mark paid') + '</button>'
        : '<div class="ta-note">'+(b.mode==='auto'
             ? 'Pays itself — BM reconciles it against the bank later.'
             : 'The tenant pays this during the Henge tenancy.')+'</div>')
    + '</div></div>';
}

function infoSheetHTML(){
  var rows = [
    ['Where it lives', "<code>localStorage</code> &mdash; a storage bucket tied to THIS Home Screen icon specifically. Not cache, not shared with a Safari tab, doesn't sync anywhere until you tap Export."],
    ['What deletes it', "Deleting this Home Screen icon and re-adding it &middot; Settings &rarr; Safari &rarr; Clear History and Website Data &middot; Settings &rarr; Safari &rarr; Advanced &rarr; Website Data &rarr; remove this site."],
    ["What's safe", "Force-quitting the app, restarting your phone, low-storage warnings, normal iOS updates &mdash; none of these touch it."],
    ['Real backup', "None of the above is a guarantee for every edge case. <b>Export regularly and AirDrop it off the phone</b> &mdash; that's the actual insurance, not a courtesy."],
  ];
  return '<div class="sheet-backdrop" onclick="closeInfoSheet()">' +
    '<div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-handle"></div><div class="sheet-title">Where your data lives</div>' +
      rows.map(function(r){
        return '<div class="info-row"><div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div></div>';
      }).join('') +
    '</div></div>';
}

function render(){
  var root = document.getElementById('root');
  if(state.loading){
    root.innerHTML = '<div class="loading">Loading…</div>';
    return;
  }
  root.innerHTML =
    '<div class="screen-container">' + (state.tab==='add' ? addScreenHTML() :
      state.tab==='bills' ? billsScreenHTML() :
      state.tab==='market' ? marketScreenHTML() : historyScreenHTML()) + '</div>' +
    tabbarHTML() +
    '<div id="toast" class="toast"></div>' +
    (state.currencySheetOpen ? currencySheetHTML() : '') +
    (state.pmSheetOpen ? pmSheetHTML() : '') +
    (state.infoSheetOpen ? infoSheetHTML() : '') +
    (state.taSheetOpen ? taSheetHTML() : '') +
    (state.billOpen ? billSheetHTML() : '');
  updateSaveButtonState();
}

document.addEventListener('touchstart', function(){}, {passive:true});
loadData();
</script>
</body>
</html>
